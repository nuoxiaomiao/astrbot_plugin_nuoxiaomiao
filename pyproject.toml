[project]
name = "astrbot-plugin-nuoxiaomiao"
version = "2.5.2"
description = "糯小喵 AstrBot 插件"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astrbot>=4.29.0",
    "quart>=0.19",
    "mcp>=1.0",
]

[project.optional-dependencies]
gif = ["pillow>=10.0"]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# 保持 ruff 默认规则集（E4/E7/E9/F）；长 SQL/提示语字符串不启用 E501。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
