<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>糯小喵 · 配置</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand"><strong>糯小喵</strong><span class="brand-sub">配置</span></div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索配置项" aria-label="搜索配置" autocomplete="off">
      <button id="search-clear" class="search-clear" type="button" aria-label="清空搜索" hidden>×</button>
    </div>
    <span id="timezone" class="timezone"></span>
  </header>

  <main class="main" id="app" hidden>
    <div id="banner" class="banner" hidden></div>
    <div id="diagnostics" class="diagnostics" aria-live="polite"></div>
    <div id="error-summary" class="error-summary" role="alert" hidden></div>
    <div id="groups" class="groups"></div>
    <details id="resident" class="resident">
      <summary>自主运行与状态</summary>
      <div id="resident-root"></div>
    </details>
  </main>

  <footer class="savebar">
    <div class="save-status">
      <strong id="dirty">没有待保存的修改</strong>
      <small id="save-detail">配置加载后可编辑</small>
    </div>
    <div class="save-actions">
      <button id="restore-factory" class="btn" type="button" disabled>恢复出厂默认</button>
      <button id="revert" class="btn" type="button" disabled>撤销修改</button>
      <button id="save" class="btn primary" type="button" disabled>保存修改</button>
    </div>
  </footer>

  <div id="boot" class="boot" role="status"><p>正在读取配置…</p></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="./resident.js"></script>
  <script src="./app.js"></script>
</body>
</html>
