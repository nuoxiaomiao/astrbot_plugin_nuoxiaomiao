name: astrbot_plugin_nuoxiaomiao
display_name: 糯小喵
short_desc: 消息防抖合并、拟人回复、刷屏拦截与互动、聊天速览、主动消息、自醒、长期记忆按需检索，以及共享记忆与信箱（主脑/话题/识图，默认关闭）。
desc: 消息防抖合并、拟人回复、刷屏拦截与互动、聊天速览、主动消息、自醒和长期记忆按需检索；可选的跨会话主脑共享记忆、未读信箱分流、点名通知卡、话题概括与群聊识图。
help: |
  配置入口：插件详情页 → 页面 → 配置，也可使用 AstrBot 原生配置表单。
  左侧导航按功能分组，一次显示一个分组；每个功能开关下折叠“设置”和“名单与范围”，功能关闭时整块收起（展开即可预先编辑）；顶部搜索跨分组定位并高亮命中；修改进入草稿，点击保存后生效。
  自主运行记录、当前状态与表达风格在左侧“运行与状态”：先看今日摘要与待办，运行记录默认收起，点开看详情。
  输入防抖合并用户连发消息，拟人回复在输出处理完成后控制发送节奏。
  刷屏免检/仅检测名单与完全屏蔽用户独立设置；各功能群名单独立。
  聊天参考支持工具按需、关键词预取、每轮背景；跨会话查看默认仅管理员可用。
  主动消息只向允许目标发送，静默时段内顺延；自醒判断和发送次数分别设限。
  指定自醒模型后不自动换模型，留空使用全局默认。
  共享记忆与信箱：全部默认关闭。全局主脑让所有会话共享同一段连续记忆（并发的聊天回合串行防丢历史）；
  未读信箱把群里未点名、未命中关键词的普通消息静默收进信箱，点名或关键词唤醒时仍即时回复；
  点名通知卡在唤醒时注入未读情况、近期话题与最近消息；话题概括由轻量模型把一段未读聊天压成一句话题；
  群聊识图把群里图片留底并在后台自动转述，模型可用 read_image 工具按会话与消息查看任意一张图。
  默认设置可填入草稿；删除个人默认快照不会改变当前运行配置。
