name: astrbot_plugin_nuoxiaomiao
display_name: 糯小喵
short_desc: 消息防抖合并、整轮发送排队、刷屏拦截与互动、聊天速览与未读信箱计数、主动消息与自主自醒（支持 QQ 官方机器人）。
desc: 消息防抖合并、整轮发送排队（连续发完本轮气泡，兼容群聊并发回复插件）、刷屏拦截与互动、聊天速览与未读计数、主动消息与自主自醒；自动识别 QQ 官方机器人（qq_official）并适配全部功能：合成消息投递、纯文本、OutputPro 分段放行、入站占位 @ 清理、普通回复与 OutputPro 分段出站清洗、转发展开、长文本分段、引用唤醒、主动消息送达确认；群主动消息默认关闭，管理员/名单/目标需填 openid，戳一戳/正在输入/成员资料等平台限制会降级并记录日志。
help: |
  配置入口：插件详情页 → 页面 → 配置，也可使用 AstrBot 原生配置表单。
  左侧导航按功能分组，一次显示一个分组；每个功能开关下折叠“设置”和“名单与范围”，功能关闭时整块收起（展开即可预先编辑）；顶部搜索跨分组定位并高亮命中；修改进入草稿，点击保存后生效。
  自主运行记录与当前状态在左侧“运行与状态”：先看今日摘要与待核实项，运行记录默认收起，点开看详情。
  输入防抖合并用户连发消息，分段与打字节奏交给 OutputPro（插件自动为 QQ 官方放行 OutputPro 分段），并在本轮处理链内占住整轮发送权把气泡发完；
  与群聊并发回复插件（如 AstrNa）共存时，同群不同群友的模型仍可并发生成，实际发送按整轮排队、气泡不穿插。
  刷屏免检/仅检测名单与完全屏蔽用户独立设置；各功能群名单独立。
  聊天参考支持工具按需、关键词预取、每轮背景；跨会话查看默认仅管理员可用。
  主动消息只向允许目标发送，静默时段内顺延；自醒 24 小时按概率运行（可按需设每日次数上限），主动发送单独限次。
  指定自醒模型后不自动换模型，留空使用全局默认。
  QQ 官方机器人（qq_official）：自动识别平台并适配全部出站/入站路径：合成消息投递、纯文本、OutputPro 分段放行与被动条数告警、
  入站占位 @ 清理、普通回复/OutputPro 分段的出站清洗、转发展开、长文本分段、引用唤醒、主动消息送达确认；
  群聊主动消息默认关闭，需要平台主动消息权限且重启后该群先来消息；群里通常只收 @ 消息；
  QQ 官方没有戳一戳/正在输入/成员资料/历史消息接口。管理员请填 qq_official_admin_openids，名单与主动目标请填 openid。
  主动消息无权限时会明确返回 failed，不伪造成功；QQ 官方被动回复在客户端显示为“回复/艾特触发者”是平台渲染，不是插件发出的 @。
  默认设置可填入草稿；删除个人默认快照不会改变当前运行配置。
