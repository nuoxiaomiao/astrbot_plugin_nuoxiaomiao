name: astrbot_plugin_nuoxiaomiao
display_name: 糯小喵
short_desc: 消息防抖合并、拟人回复、刷屏拦截与互动、聊天速览、主动消息、自醒和长期记忆按需检索。
desc: 消息防抖合并、拟人回复、刷屏拦截与互动、聊天速览、主动消息、自醒和长期记忆按需检索。
help: |
  配置入口：插件详情页 → 页面 → 配置，也可使用 AstrBot 原生配置表单。
  常用功能直接展开，高级参数按需展开；修改进入草稿，点击保存后生效。
  输入防抖合并用户连发消息，拟人回复在输出处理完成后控制发送节奏。
  刷屏免检/仅检测名单与完全屏蔽用户独立设置；各功能群名单独立。
  聊天参考支持工具按需、关键词预取、每轮背景；跨会话查看默认仅管理员可用。
  主动消息只向允许目标发送，静默时段内顺延；自醒判断和发送次数分别设限。
  指定自醒模型后不自动换模型，留空使用全局默认。
  默认设置可填入草稿；删除个人默认快照不会改变当前运行配置。
version: 2.2.0
author: nuoxiaomiao
